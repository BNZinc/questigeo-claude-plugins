name: Validate Claude plugin

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run check
      - run: npm test
      - name: Validate with Claude Code
        run: >-
          npx --yes --package=@anthropic-ai/claude-code@2.1.236
          claude plugin validate --strict plugins/questi-geo
      - name: Validate marketplace with Claude Code
        run: >-
          npx --yes --package=@anthropic-ai/claude-code@2.1.236
          claude plugin validate --strict .claude-plugin/marketplace.json
